<!doctype html>
<html><head><meta charset="utf-8"><title>Tatkal - 16-bit Pixel RPG</title>
<style>
@font-face{font-family:PS;src:url(node_modules/@fontsource/press-start-2p/files/press-start-2p-latin-400-normal.woff2)}
*{margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0916}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated;image-rendering:crisp-edges}
</style></head><body>
<canvas id="cv" width="180" height="320"></canvas>
<script src="styles_data.js"></script>
<script>
const T=window.T,cv=document.getElementById('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const W=180,H=320;
const PAL={ink:'#14102a',win:'#1c2f7a',win2:'#172668',white:'#f4f4f4',silver:'#9fa8c9',gold:'#ffd23f',red:'#f2515b',green:'#5bd66d',cyan:'#5ad6ff',dim:'#6f77a8',skin:'#e8b48a',hair:'#5a3a22'};
const B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]]; // 4x4 Bayer
const bay=(x,y)=>(B4[y&3][x&3]+.5)/16;
const bgs={};
function bgFor(idx){ // night sky -> deep blue, gradient only by ordered dither, plus stars
 if(bgs[idx])return bgs[idx];const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),img=x.createImageData(W,H);
 const A=[[20,16,60],[36,52,118],[62,38,92]][idx%3],Bc=[[10,8,30],[24,32,80],[38,22,58]][idx%3];
 for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const k=Math.min(1,y/H*1.15),use=k>bay(xx,y)?Bc:A,i=(y*W+xx)*4;img.data[i]=use[0];img.data[i+1]=use[1];img.data[i+2]=use[2];img.data[i+3]=255;}
 for(let s=0;s<34;s++){const sx=(Math.sin(s*91.7+idx)*.5+.5)*W|0,sy=(Math.sin(s*47.3+idx*3)*.5+.5)*(H*.55)|0,i=(sy*W+sx)*4;img.data[i]=img.data[i+1]=img.data[i+2]=s%3?190:255;}
 x.putImageData(img,0,0);return bgs[idx]=c;}
function win(x,y,w,h){g.fillStyle=PAL.ink;g.fillRect(x-2,y-2,w+4,h+4);g.fillStyle=PAL.white;g.fillRect(x-1,y-1,w+2,h+2);g.fillStyle=PAL.silver;g.fillRect(x,y,w,h);
 g.fillStyle=PAL.win;g.fillRect(x+1,y+1,w-2,h-2);g.fillStyle=PAL.win2;for(let yy=y+1;yy<y+h-1;yy++)for(let xx=x+1;xx<x+w-1;xx++)if(((xx+yy)&1)===0&&((yy&1)===0))g.fillRect(xx,yy,1,1);}
function wrap(s,n){const o=[];let cur='';for(const w of s.split(' ')){if((cur+' '+w).trim().length>n){if(cur)o.push(cur);cur=w.length>n?w.slice(0,n):w;}else cur=(cur?cur+' ':'')+w;}if(cur)o.push(cur);return o.length?o:[''];}
const col=t=>t==='alert'?PAL.red:t==='ok'?PAL.green:t==='accent'?PAL.gold:t==='dim'?PAL.dim:PAL.white;
function txt(s,x,y,c,size=8){g.font=`${size}px PS`;g.textBaseline='top';g.fillStyle=PAL.ink;g.fillText(s,x+1,y+1);g.fillStyle=c;g.fillText(s,x,y);}
function portrait(x,y,t,talk){g.fillStyle=PAL.ink;g.fillRect(x-1,y-1,34,34);g.fillStyle=PAL.silver;g.fillRect(x,y,32,32);g.fillStyle=PAL.win2;g.fillRect(x+1,y+1,30,30);
 g.fillStyle=PAL.hair;g.fillRect(x+7,y+4,18,8);g.fillRect(x+5,y+7,3,10);g.fillRect(x+24,y+7,3,10);g.fillStyle=PAL.skin;g.fillRect(x+8,y+9,16,17);g.fillStyle=PAL.ink;const blink=(Math.floor(t*2)%6===0);g.fillRect(x+11,y+15,2,blink?1:3);g.fillRect(x+19,y+15,2,blink?1:3);
 g.fillStyle='#b8575b';g.fillRect(x+13,y+22,6,talk?3:1);g.fillStyle=PAL.win;g.fillRect(x+6,y+26,20,6);}
function hero(x,y,t){const f=Math.floor(t*4)%2;g.fillStyle=PAL.ink;g.fillRect(x-1,y-1,10,14);g.fillStyle=PAL.skin;g.fillRect(x+2,y,5,4);g.fillStyle=PAL.hair;g.fillRect(x+2,y-1,5,2);g.fillStyle=PAL.red;g.fillRect(x+1,y+4,7,5);g.fillStyle=PAL.ink;g.fillRect(x+1+f,y+9,2,3);g.fillRect(x+5-f,y+9,2,3);}
function frame(t,sc,s,idx){
 const c=sc.cues,ls=t-sc.start;g.drawImage(bgFor(idx),0,0);
 // title window: category + the chapter title, typed
 const t1=wrap(s.head[1],17),h0=s.head[0].replace(/,$/,'');const th=10+(t1.length+1)*10;win(8,36,164,th);
 const n0=Math.floor((ls-.1)/.03);txt(('CH.'+(idx+1)+' '+h0).toUpperCase().slice(0,Math.max(0,n0)),14,41,PAL.cyan);
 let left=Math.max(0,Math.floor((ls-.1)/.03)-20);t1.forEach((l,i)=>{txt(l.toUpperCase().slice(0,Math.max(0,left)),14,51+i*10,PAL.gold);left-=l.length;});
 hero(150,40+((th-14)/2|0),t);
 // item window: one status window, rows typed 30 chars/s, newest marked with a cursor
 const ec=s.items.find(i=>i.k==='endcard');const endOn=ec&&t>=AT(ec.at,c);
 let rows=[];
 if(endOn){const ta=AT(ec.at,c);wrapLines(ec.lines[0].toUpperCase(),17).forEach(l=>rows.push({s:l,c:PAL.gold,sz:16,ta}));rows.push({s:'',ta});wrap(ec.lines[1].toUpperCase(),19).forEach(l=>rows.push({s:l,c:PAL.white,ta:ta+.3}));wrap(ec.lines[2].toUpperCase(),19).forEach(l=>rows.push({s:l,c:PAL.dim,ta:ta+.7}));}
 else s.items.forEach(it=>{if(it.k==='endcard')return;const x=RESOLVE(it,t,c);if(!x.vis)return;
  if(it.k==='val'){rows.push({s:it.label.toUpperCase().slice(0,19),c:PAL.silver,ta:x.ta});rows.push({s:x.text,c:PAL.gold,sz:16,ta:x.ta,big:1});}
  else if(it.k==='meter'){rows.push({s:it.label.toUpperCase().slice(0,9),c:col(x.tone),ta:x.ta,bar:clamp(x.ratio),val:x.text});}
  else if(it.k==='cmd'){wrap(it.text,19).forEach(l=>rows.push({s:l,c:PAL.cyan,ta:x.ta}));}
  else if(x.text){wrap(x.text.toUpperCase(),19).forEach(l=>rows.push({s:l,c:col(x.tone),ta:x.ta,strike:x.flag==='strike'}));}});
 const rh=r=>r.big?20:10;const hh=rows.reduce((a,r)=>a+rh(r),0)+12;const top=36+th+8;
 if(rows.length){win(8,top,164,Math.min(hh,205-top));let y=top+6;
  rows.forEach((r,i)=>{if(y>196)return;const cps=.03;const n=Math.floor((t-r.ta)/cps);if(r.bar!==undefined){txt(r.s,14,y,r.c);const bx=14+10*8,bw=28;g.fillStyle=PAL.ink;g.fillRect(bx-1,y,bw+2,8);g.fillStyle=PAL.silver;g.fillRect(bx,y+1,bw,6);g.fillStyle=r.c;g.fillRect(bx,y+1,Math.round(bw*r.bar),6);txt(r.val.slice(-5),bx+bw+3,y,PAL.white);}
   else{const shown=r.big?r.s:r.s.slice(0,Math.max(0,n));txt(shown,14,y,r.c,r.sz||8);if(r.strike){g.fillStyle=PAL.red;g.fillRect(14,y+4,Math.min(r.s.length*8,shown.length*8),1);}
    const last=i===rows.length-1||rows[i+1].ta>t;if(last&&!r.big&&Math.floor(t*3)%2===0)txt('>',6,y,PAL.gold);}
   y+=rh(r);});}
 // dialog box = subtitle: portrait + typed text, bottom quarter
 const cap=CAP(t,T.scenes);if(cap){win(6,208,168,40);const talk=Math.floor(t*8)%2===0&&t-cap.t0<cap.text.length*.03+.2;portrait(10,212,t,talk);const lines=wrap(cap.text.replace(/\*/g,'').toUpperCase(),15);let k=Math.floor((t-cap.t0)/.028);lines.slice(0,3).forEach((l,i)=>{txt(l.slice(0,Math.max(0,k)),46,213+i*10,PAL.white);k-=l.length;});}
 // palette fade in/out by ordered-dither steps (4 steps), never by alpha
 const f=Math.max(1-P(ls,0,.3),P(ls,sc.dur-.3,sc.dur)),lv=Math.ceil(f*4)/4;if(lv>0){const img=g.getImageData(0,0,W,H),d=img.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(lv>bay(x,y)){const i=(y*W+x)*4;d[i]=10;d[i+1]=8;d[i+2]=22;}}g.putImageData(img,0,0);}
}
function wrapLines(s,n){return wrap(s,n);}
window.renderAt=function(t){const idx=T.scenes.indexOf(SCENE_AT(t,T.scenes)),sc=T.scenes[idx];g.clearRect(0,0,W,H);frame(t,sc,SD[sc.id],idx);};
window.ready=document.fonts.load('8px PS','A').catch(()=>[]).then(()=>document.fonts.load('16px PS','A').catch(()=>[]));
</script></body></html>
