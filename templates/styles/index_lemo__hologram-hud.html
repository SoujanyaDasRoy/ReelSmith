<!doctype html>
<html><head><meta charset="utf-8"><title>Tatkal - Hologram HUD</title>
<style>
@font-face{font-family:RJ;font-weight:500;src:url(node_modules/@fontsource/rajdhani/files/rajdhani-latin-500-normal.woff2)}
@font-face{font-family:RJ;font-weight:600;src:url(node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2)}
@font-face{font-family:RJ;font-weight:700;src:url(node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2)}
@font-face{font-family:TM;src:url(node_modules/@fontsource/share-tech-mono/files/share-tech-mono-latin-400-normal.woff2)}
:root{--h:#5CF2E0;--a:#FF8A3D}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#03070a;font-family:RJ,sans-serif;font-weight:600;color:var(--h);text-transform:uppercase}
canvas{position:absolute;left:0;top:0}
.scene{position:absolute;inset:0;display:none}
.lab{font-family:TM;font-size:19px;letter-spacing:.2em;color:rgba(92,242,224,.7)}
.hud{position:absolute;font-family:TM;font-size:19px;letter-spacing:.16em;color:rgba(92,242,224,.85)}
.title{position:absolute;left:66px;top:188px;font-weight:500;font-size:84px;letter-spacing:.14em;color:#e9fffb;white-space:nowrap;text-shadow:0 0 18px rgba(92,242,224,.45)}
.cards{position:absolute;left:96px;width:900px;top:640px;display:flex;flex-direction:column;gap:14px}
.card{position:relative;min-height:70px;padding:12px 20px 10px 24px;background:rgba(4,16,20,.82);border:1px solid rgba(92,242,224,.55)}
.card:before,.card:after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--h)}.card:before{left:-2px;top:-2px;border-right:0;border-bottom:0}.card:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.card .t{font-weight:600;font-size:34px;letter-spacing:.06em;line-height:1.1;color:#dffff9}.card.dim .t{color:rgba(92,242,224,.5)}
.card .t.v{font-family:TM;font-weight:400}.card .lock{color:var(--a)}
.card .brk{position:absolute;inset:-12px;border:3px solid var(--h);pointer-events:none}
.card .ring{position:absolute;left:-44px;top:30px;width:14px;height:14px;border:2px solid var(--h);border-radius:50%}
.card .ld{position:absolute;left:-30px;top:36px;height:2px;background:var(--h)}
.bigv{font-family:TM;font-size:120px;letter-spacing:.02em;line-height:1}
.mt{display:flex;align-items:center;gap:16px}.mt .bar{position:relative;flex:1;height:14px;border:1px solid var(--h)}.mt .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--h);opacity:.85;box-shadow:0 0 14px var(--h)}
#cap{position:absolute;left:50%;transform:translateX(-50%);top:1296px;min-width:560px;max-width:960px;padding:14px 30px 12px 80px;background:rgba(3,12,16,.88);border:1px solid rgba(92,242,224,.6);font-weight:500;font-size:40px;letter-spacing:.06em;color:#eafffb}
#cap:before,#cap:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--h)}#cap:before{left:-2px;top:-2px;border-right:0;border-bottom:0}#cap:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
#cap .vp{position:absolute;left:22px;top:50%;margin-top:-16px;display:flex;gap:4px;align-items:center;height:32px}#cap .vp i{width:4px;background:var(--h)}
#cap em{font-style:normal;color:var(--a)}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas><div id="stage"></div>
<div class="hud" style="left:66px;top:150px">SUBJECT // TATKAL.SYS</div><div class="hud" id="stat" style="right:66px;top:150px;text-align:right"></div>
<div class="hud" id="tele" style="left:66px;top:1450px"></div>
<div id="cap"></div>
<script src="styles_data.js"></script>
<script>
const T=window.T,stage=document.getElementById('stage'),capEl=document.getElementById('cap'),stat=document.getElementById('stat'),tele=document.getElementById('tele'),cv=document.getElementById('cv'),g=cv.getContext('2d');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const H=[92,242,224];
const SHAPE={hook:'sphere',question:'octa',naive:'cyl',race:'cube',wait:'torus',lock:'lock',shard:'cyls',pay:'box',outro:'ticket'};
// wireframe builders -> edges [[x,y,z],[x,y,z]]
const ring=(r,y,n=28,cx=0,cz=0)=>{const e=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;e.push([[cx+Math.cos(a)*r,y,cz+Math.sin(a)*r],[cx+Math.cos(b)*r,y,cz+Math.sin(b)*r]]);}return e;};
const boxE=(w,h,d,ox=0,oy=0,oz=0)=>{const v=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1])v.push([ox+x*w,oy+y*h,oz+z*d]);const E=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let df=0;for(let k=0;k<3;k++)if(v[i][k]!==v[j][k])df++;if(df===1)E.push([v[i],v[j]]);}return E;};
const SH={
 sphere:()=>{let e=[];for(let i=-3;i<=3;i++){const y=i/4*1.0*110;e=e.concat(ring(Math.sqrt(Math.max(0,110*110-y*y)),y,30));}for(let k=0;k<5;k++){const a=k*Math.PI/5;for(let i=0;i<30;i++){const p=i/30*Math.PI*2,q=(i+1)/30*Math.PI*2;e.push([[Math.cos(p)*110*Math.cos(a),Math.sin(p)*110,Math.cos(p)*110*Math.sin(a)],[Math.cos(q)*110*Math.cos(a),Math.sin(q)*110,Math.cos(q)*110*Math.sin(a)]]);}}return e;},
 octa:()=>{const p=[[120,0,0],[-120,0,0],[0,120,0],[0,-120,0],[0,0,120],[0,0,-120]],e=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const d=p[i].map((v,k)=>Math.abs(v-p[j][k])).reduce((a,b)=>a+b,0);if(d<260)e.push([p[i],p[j]]);}return e;},
 cyl:()=>{let e=[...ring(90,-100),...ring(90,-30),...ring(90,40),...ring(90,110)];for(let i=0;i<12;i++){const a=i/12*Math.PI*2;e.push([[Math.cos(a)*90,-100,Math.sin(a)*90],[Math.cos(a)*90,110,Math.sin(a)*90]]);}return e;},
 cube:()=>boxE(90,90,90),
 torus:()=>{const e=[];for(let u=0;u<16;u++){const a=u/16*Math.PI*2;e.push(...ring(36,0,14,Math.cos(a)*100,Math.sin(a)*100).map(([p,q])=>{const f=([x,y,z])=>{const dx=x-Math.cos(a)*100,dz=z-Math.sin(a)*100;return[Math.cos(a)*100+dx*Math.cos(a)*1+0,y+dz*0+Math.sqrt(dx*dx+dz*dz)*Math.sin(Math.atan2(dz,dx))*0,Math.sin(a)*100+dx*Math.sin(a)];};return[f(p),f(q)];}));}return [...ring(100,0,36),...ring(60,0,28),...ring(140,0,36),...ring(100,36,28),...ring(100,-36,28)];},
 lock:()=>[...boxE(100,70,50,0,50,0),...ring(60,-40,18).map(([p,q])=>[[p[0],p[1]-Math.abs(p[2])*.0,p[2]*.0+p[2]*0],[q[0],q[1],q[2]*0]])].concat((()=>{const e=[];for(let i=0;i<14;i++){const a=Math.PI*i/14,b=Math.PI*(i+1)/14;e.push([[Math.cos(a)*55,-20-Math.sin(a)*90,0],[Math.cos(b)*55,-20-Math.sin(b)*90,0]]);}return e;})()),
 cyls:()=>[0,1,2,3].flatMap(i=>{const x=(i-1.5)*100;return[...ring(36,-70,18,x,0),...ring(36,70,18,x,0),[[x-36,-70,0],[x-36,70,0]],[[x+36,-70,0],[x+36,70,0]]];}),
 box:()=>boxE(130,80,12),
 ticket:()=>[...boxE(140,80,8),...ring(22,0,14,-140,0).map(([p,q])=>[[p[0],p[2],0],[q[0],q[2],0]]),...ring(22,0,14,140,0).map(([p,q])=>[[p[0],p[2],0],[q[0],q[2],0]])],
};
const cache={};const edges=id=>cache[id]||(cache[id]=SH[SHAPE[id]]());
function drawBG(t,ls,sc){
 g.clearRect(0,0,1080,1920);const gr=g.createRadialGradient(540,430,40,540,430,760);gr.addColorStop(0,'rgba(20,70,70,.55)');gr.addColorStop(1,'rgba(3,7,10,0)');g.fillStyle=gr;g.fillRect(0,0,1080,1920);
 // background dot grid with slow parallax
 g.fillStyle='rgba(92,242,224,.16)';const ox=(t*6)%48,oy=(t*3)%48;for(let y=-48;y<1920;y+=48)for(let x=-48;x<1080;x+=48){g.fillRect(x+ox,y+oy,2,2);}
 // rulers that parallax faster
 g.strokeStyle='rgba(92,242,224,.55)';g.lineWidth=1;const ro=(t*30)%24;for(let y=-24;y<1500;y+=24){const len=(Math.round((y+ro)/24)%5===0)?22:11;g.beginPath();g.moveTo(1080,y+ro+200);g.lineTo(1080-len,y+ro+200);g.stroke();g.beginPath();g.moveTo(0,y-ro+200);g.lineTo(len,y-ro+200);g.stroke();}
 // corner brackets
 g.lineWidth=3;g.strokeStyle='rgba(92,242,224,.9)';for(const [x,y,dx,dy] of [[56,190,1,1],[1024,190,-1,1],[56,1420,1,-1],[1024,1420,-1,-1]]){g.beginPath();g.moveTo(x,y+dy*46);g.lineTo(x,y);g.lineTo(x+dx*46,y);g.stroke();}
}
function drawSubject(t,ls,sc){
 const cx=540,cy=420,scanP=EZ.out(P(ls,.1,1.1)),rot=t*.55+ls*.2;
 // projector pad in perspective: concentric rings, one dashed, rotating ticks
 g.save();g.translate(cx,cy+230);g.scale(1,.26);for(const [r,w,a,dash] of [[300,2,.9,0],[250,1,.6,1],[200,1,.4,0]]){g.strokeStyle=`rgba(92,242,224,${a})`;g.lineWidth=w*2;g.setLineDash(dash?[14,10]:[]);g.lineDashOffset=-t*40;g.beginPath();g.arc(0,0,r,0,7);g.stroke();}g.setLineDash([]);for(let i=0;i<48;i++){const a=i/48*Math.PI*2+t*.2;g.strokeStyle='rgba(92,242,224,.5)';g.beginPath();g.moveTo(Math.cos(a)*300,Math.sin(a)*300);g.lineTo(Math.cos(a)*(i%4?312:326),Math.sin(a)*(i%4?312:326));g.stroke();}g.restore();
 // wireframe: a scan plane grows it bottom to top; depth fog dims far edges; hot edge at the scan front
 const E=edges(sc.id),yaw=rot,pit=.38,cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);g.globalCompositeOperation='lighter';
 const proj=([x,y,z])=>{let X=x*cyaw+z*syaw,Z=-x*syaw+z*cyaw;let Y=y*cp-Z*sp;Z=y*sp+Z*cp;const f=520/(520+Z);return[cx+X*f*1.35,cy-20+Y*f*1.35,Z];};
 const frontY=lerp(150,-150,scanP);
 for(const [p,q] of E){const a=proj(p),b=proj(q);if(scanP<1&&p[1]<frontY&&q[1]<frontY)continue;const fog=clamp(1-(a[2]+b[2])/2/380,.25,1);const hot=Math.abs(((p[1]+q[1])/2)-frontY)<12&&scanP<1;g.strokeStyle=hot?`rgba(240,255,252,${.95*fog})`:`rgba(${H[0]},${H[1]},${H[2]},${.85*fog})`;g.lineWidth=hot?2.4:1.5;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
 g.globalCompositeOperation='source-over';
 // glow pass
 g.save();g.filter='blur(6px)';g.globalAlpha=.5;g.drawImage(cv,0,0);g.restore();
}
const built={};
function mk(cls,html,css){const e=document.createElement('div');if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)e.style.cssText=css;return e;}
const GL='01#%$&@ABCDEF<>/\\';
const scramble=(txt,p,seed)=>{const n=txt.length,locked=Math.floor(p*n);let o='';for(let i=0;i<n;i++){const fromRight=n-1-i;const ch=txt[i];if(ch===' '||fromRight<locked||p>=1)o+=ch;else o+=GL[Math.floor(Math.abs(Math.sin(seed*13.7+i*7.1+Math.floor(seed*1000)%17))*GL.length)];}return o;};
function build(sc,idx){
 const s=SD[sc.id],root=mk('scene');
 const title=mk('title',esc(s.head[1]));root.appendChild(title);stage.appendChild(root);root.style.display='block';const w=title.getBoundingClientRect().width;if(w>950)title.style.fontSize=Math.floor(84*950/w)+'px';root.style.display='none';
 root.appendChild(mk('lab',esc(s.head[0].replace(/,$/,'')),'position:absolute;left:68px;top:268px;display:none'));
 const cards=mk('cards');root.appendChild(cards);const els=[];let ec=null,ecEl=null;
 s.items.forEach(it=>{if(it.k==='endcard'){ec=it;return;}const e=mk('card','<div class="ring"></div><div class="ld"></div><div class="brk"></div><div class="body"></div>');cards.appendChild(e);els.push({it,e,body:e.querySelector('.body'),brk:e.querySelector('.brk'),ld:e.querySelector('.ld'),ring:e.querySelector('.ring')});});
 if(ec){ecEl=mk('card',`<div class="bigv" style="font-family:RJ;font-weight:500;letter-spacing:.2em;color:#e9fffb">${esc(ec.lines[0])}</div><div class="t lock" style="margin-top:14px;font-size:38px">${esc(ec.lines[1])}</div><div class="lab" style="margin-top:12px">${esc(ec.lines[2])}</div>`,'position:absolute;left:96px;top:700px;width:900px;padding:26px 28px;display:none');root.appendChild(ecEl);}
 return {root,els,ec,ecEl,cards,title};
}
function update(b,sc,s,t,idx){
 const c=sc.cues,ls=t-sc.start;
 // the title rolls in like a value
 b.title.textContent=scramble(s.head[1].toUpperCase(),EZ.out(P(ls,.1,.75)),Math.floor(t*24));b.title.style.opacity=P(ls,.05,.15);
 const endOn=b.ec&&t>=AT(b.ec.at,c);
 if(b.ecEl){b.ecEl.style.display=endOn?'block':'none';b.ecEl.style.opacity=P(t,AT(b.ec.at,c),AT(b.ec.at,c)+.2);}
 b.cards.style.display=endOn?'none':'flex';
 b.els.forEach(({it,e,body,brk,ld,ring})=>{
  const x=RESOLVE(it,t,c);e.style.visibility=x.vis?'visible':'hidden';if(!x.vis)return;
  const d=t-x.ta,lock=EZ.out(P(d,0,.2)),flash=d<.125?1:0;
  e.style.opacity=P(d,0,.05);e.className='card '+(x.tone==='dim'?'dim':'');
  brk.style.transform=`scale(${1+(1-lock)*.7}) rotate(${(1-lock)*45}deg)`;brk.style.opacity=lock<1?.45:0;e.style.borderColor=flash?'#fff':'rgba(92,242,224,.55)';
  ld.style.width=(EZ.out(P(d,.05,.35))*26)+'px';ring.style.opacity=P(d,0,.1);
  const rp=P(d,.05,.55);const seed=Math.floor(t*24);const lockCol=rp>=1&&d<1.2?'lock':'';
  if(it.k==='val'){const txt=scramble(x.text,rp,seed+7);body.innerHTML=`<div class="lab">${esc(it.label)}</div><div class="bigv ${rp>=1?'lock':''}">${esc(txt)}</div>`;}
  else if(it.k==='meter'){body.innerHTML=`<div class="mt"><span class="t" style="width:250px">${esc(it.label)}</span><div class="bar"><i style="width:${clamp(x.ratio)*100}%"></i></div><span class="t v ${rp>=1?'lock':''}">${esc(scramble(x.text,rp,seed))}</span></div>`;}
  else if(it.k==='cmd'){const n=Math.max(0,Math.floor((t-x.ta)/.038));body.innerHTML=`<div class="t v">${esc(it.text.slice(0,n))}<span style="color:var(--a)">_</span></div>`;}
  else{const tx=x.text||'';const sp=P(d,0,.3);body.innerHTML=`<div class="t ${x.tone==='alert'||x.tone==='accent'?'lock':''}${x.flag==='strike'?'" style="text-decoration:line-through':''}">${esc(scramble(tx,sp,seed+3))}</div>`;e.style.display=tx?'block':'none';}
 });
}
window.renderAt=function(t){
 const idx=T.scenes.indexOf(SCENE_AT(t,T.scenes)),sc=T.scenes[idx],s=SD[sc.id],ls=t-sc.start;
 drawBG(t,ls,sc);drawSubject(t,ls,sc);
 for(const id in built)built[id].root.style.display='none';
 const b=built[sc.id];b.root.style.display='block';update(b,sc,s,t,idx);
 stat.textContent=`LOCK ${String(idx+1).padStart(2,'0')}/${String(T.scenes.length).padStart(2,'0')} · ${Math.floor(t*24)%100} FPS 24`;
 tele.textContent=`X ${(Math.sin(t)*40).toFixed(1)}  Y ${(Math.cos(t*.7)*30).toFixed(1)}  Z ${(t*3.1).toFixed(2)}   //   SCAN ${Math.round(EZ.out(P(ls,.1,1.1))*100)}%`;
 const cap=CAP(t,T.scenes);
 if(cap){capEl.style.display='block';const bars=[...Array(7)].map((_,i)=>`<i style="height:${6+Math.abs(Math.sin(t*14+i*1.7))*20}px"></i>`).join('');capEl.innerHTML=`<span class="vp">${bars}</span>`+esc(cap.text).replace(/\*([^*]+)\*/g,'<em>$1</em>');capEl.style.opacity=P(t,cap.t0-.05,cap.t0+.1);}else capEl.style.display='none';
};
window.ready=Promise.all(['500 40px RJ','600 40px RJ','700 40px RJ','40px TM'].map(f=>document.fonts.load(f,'A').catch(()=>[]))).then(()=>{T.scenes.forEach((sc,i)=>{built[sc.id]=build(sc,i);});});
</script></body></html>
